# n8n, the recruiter app, and Caddy (HTTPS) for the matching pipeline.
# n8n keeps its own data (workflows, executions, credentials) in SQLite in a Docker volume,
# outside the Supabase project shared with reviewers.
name: match-n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"          # keep 14 days of execution history
      N8N_RUNNERS_TASK_TIMEOUT: "1800"        # a search plus 100 postings can take more than the default 5 minutes
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # Code nodes read SUPABASE_*, OPENROUTER_*, APIFY_* from env
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      APIFY_TOKEN: ${APIFY_TOKEN}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"

  web:
    build: ./web
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      N8N_HOST: ${N8N_HOST}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET}
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      N8N_ONBOARDING_WORKFLOW_ID: ${N8N_ONBOARDING_WORKFLOW_ID}
      N8N_DAILY_WORKFLOW_ID: ${N8N_DAILY_WORKFLOW_ID}
    expose:
      - "3000"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      N8N_HOST: ${N8N_HOST}
      APP_HOST: ${APP_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - web

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
